services:
  pushrss:
    build: .
    image: pushrss:local
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_PATH: /data/pushrss.db
      PUSHRSS_WEB_DIR: /app/apps/web/dist
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pushrss-data:/data

volumes:
  pushrss-data:
